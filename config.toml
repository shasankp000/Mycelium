# =============================================================================
# Mycelium – Central Configuration
# =============================================================================
# Edit this file to control every tunable parameter in the system.
# Resolution order for every value: ENV VAR → this file → hard-coded default.
# So CI / Docker overrides (e.g. OLLAMA_MODEL=…) still take precedence.
#
# After changing this file you do NOT need to restart the server; config_loader
# re-reads it on every call (cheap because TOML parsing is fast).
# =============================================================================

# ---------------------------------------------------------------------------
# Ollama (primary LLM backend)
# ---------------------------------------------------------------------------
[ollama]
model           = "qwen3.5:9b"   # env: OLLAMA_MODEL
base_url        = "http://localhost:11434"  # env: OLLAMA_BASE_URL
temperature     = 0.2             # env: OLLAMA_TEMPERATURE
context_size    = 4096            # num_ctx passed in options  env: OLLAMA_CONTEXT_SIZE
keep_alive      = "5m"            # "10m", "1h", "-1" (never), "0" (immediately)
request_timeout = 300              # seconds  env: OLLAMA_REQUEST_TIMEOUT

# Uncomment to pass extra raw options to /api/chat:
# [ollama.extra_options]
# num_gpu        = 1
# repeat_penalty = 1.1

# ---------------------------------------------------------------------------
# HuggingFace (secondary / embedding backend)
# ---------------------------------------------------------------------------
[huggingface]
api_url        = ""     # env: HF_API_URL
api_key        = ""     # env: HF_API_KEY   (never commit real keys)
max_new_tokens = 512    # env: HF_MAX_NEW_TOKENS
temperature    = 0.2    # env: HF_TEMPERATURE

# ---------------------------------------------------------------------------
# LLM routing
# ---------------------------------------------------------------------------
[llm]
primary   = "ollama"      # "ollama" | "huggingface"
secondary = "huggingface" # fallback when primary is unavailable

# ---------------------------------------------------------------------------
# Multi-lens fusion weights  (must sum to 1.0)
# ---------------------------------------------------------------------------
[routing]
semantic_weight                  = 0.45   # env: SEMANTIC_WEIGHT
spectral_weight                  = 0.35   # env: SPECTRAL_WEIGHT
confidence_weight                = 0.20   # env: CONFIDENCE_WEIGHT
superposition_variance_threshold = 0.08   # env: SUPERPOSITION_VARIANCE_THRESHOLD
domain_score_threshold           = 0.45   # env: DOMAIN_SCORE_THRESHOLD
enable_attribute_override        = true   # env: ENABLE_ATTRIBUTE_OVERRIDE

# ---------------------------------------------------------------------------
# Expert selection
# ---------------------------------------------------------------------------
[experts]
dir                  = "tests/fixtures/dummy_models"  # env: MYCELIUM_EXPERTS_DIR
coverage_threshold  = 0.70   # env: COVERAGE_THRESHOLD
soft_stop_pct       = 0.90   # env: SOFT_STOP_PERCENTAGE
max_experts         = 3      # env: MAX_EXPERTS
similarity_threshold = 0.45  # ExpertFilter  env: EXPERT_SIMILARITY_THRESHOLD

# ---------------------------------------------------------------------------
# Logging & metrics
# ---------------------------------------------------------------------------
[logging]
enable  = true   # env: ENABLE_LOGGING
sample_rate = 1  # log every Nth request  env: LOG_SAMPLE_RATE

# ---------------------------------------------------------------------------
# Patch-batch logger
# ---------------------------------------------------------------------------
[patch_batches]
dir = "patch_batches"   # env: PATCH_BATCH_DIR

# ---------------------------------------------------------------------------
# Traces
# ---------------------------------------------------------------------------
[traces]
dir = "traces"   # env: TRACES_DIR

# ---------------------------------------------------------------------------
# API server
# ---------------------------------------------------------------------------
[api]
allowed_origins = [
    "http://localhost:3000",
    "http://127.0.0.1:3000",
]

# ---------------------------------------------------------------------------
# [lexis]  Lexis-E integration + dual-.venv architecture
# ---------------------------------------------------------------------------
[lexis]
venv2_path = ".venv2"
spacy_default_model = "en_core_web_sm"
spacy_timeout = 60

# ---------------------------------------------------------------------------
# [graph_store]  GraphStore persistence + decay settings
# ---------------------------------------------------------------------------
# persistence_dir  : directory where graphstore.jsonl is written.
#                    Created automatically if it does not exist.
#                    Override via env: MYCELIUM_GRAPH_STORE_PERSISTENCE_DIR
# run_decay_on_load: run GraphDecayManager on every boot before serving graphs.
#                    Keeps EvidenceGrounder's Tier-1 pool free of stale graphs.
#                    Override via env: MYCELIUM_GRAPH_STORE_RUN_DECAY_ON_LOAD
# ---------------------------------------------------------------------------
[graph_store]
persistence_dir    = "data"   # env: MYCELIUM_GRAPH_STORE_PERSISTENCE_DIR
run_decay_on_load  = true     # env: MYCELIUM_GRAPH_STORE_RUN_DECAY_ON_LOAD

# ---------------------------------------------------------------------------
# [layer1]  Parameters for layer_1_prototype.py
# ---------------------------------------------------------------------------
[layer1]
embed_model = "all-MiniLM-L6-v2"
lens1_top_k = 3
lens1_embedding_weight = 0.8
lens1_lexical_weight   = 0.2
tag_cluster_distance_threshold = 0.3
tag_cluster_similarity_threshold = 0.7
tag_normalize_threshold = 80
temporal_window_hours = 1
temporal_max_size = 100
temporal_time_window_hours = 24
spatial_dominance_threshold = 0.3
tag_clusters_filename = "tag_clusters.json"

# ---------------------------------------------------------------------------
# [layer1.domain_list]  Canonical domain vocabulary for tag extraction.
# NOTE: This section is auto-updated by cfg.discover_live_domains() each run.
#       Add new expert model dirs to [experts].dir and they will appear here
#       automatically on the next discovery pass. Do not edit manually.
# ---------------------------------------------------------------------------
[layer1.domain_list]
domains = ["chemistry", "medical", "physics"]

# ---------------------------------------------------------------------------
# [layer1.llama]  Ollama / local-LLM tag extractor
# ---------------------------------------------------------------------------
[layer1.llama]
model = "llama3:8b"

# ---------------------------------------------------------------------------
# [layer1.openai]  OpenAI-compatible tag extractor
# ---------------------------------------------------------------------------
[layer1.openai]
model    = "gpt-3.5-turbo"
endpoint = "https://api.openai.com/v1/chat/completions"
provider = "openai"
max_tokens  = 50
temperature = 0.2

# ---------------------------------------------------------------------------
# [unified_expert]  Parameters shared across unified_expert_system.py
# ---------------------------------------------------------------------------
[unified_expert]
max_resident_experts = 8
ood_svm_distance_threshold       = 0.3
ood_nn_distance_threshold        = 0.65
ood_isolation_score_threshold    = -0.05
ood_votes_required               = 2
composite_weight_similarity  = 0.45
composite_weight_confidence  = 0.45
composite_weight_ood         = 0.10
decision_high_threshold   = 0.5
decision_mid_threshold    = 0.25
ood_penalty_detected     = 0.5
ood_penalty_not_detected = 0.2
ood_tolerance_use_existing = 0.45
ood_rejection_threshold    = 0.6

# ---------------------------------------------------------------------------
# [workflow]  run_workflow.py settings
# ---------------------------------------------------------------------------
[workflow]
traces_dir = "traces"

# ===========================================================================
# TRM v2 — Feature-flagged sections
# All flags default to false so existing production paths are never affected
# until explicitly opted in.  Flip enabled = true one section at a time while
# running the parity suite between each change.
# ===========================================================================

# ---------------------------------------------------------------------------
# [trm_v2]  TRM v2 neural architecture flags
# ---------------------------------------------------------------------------
# enabled              : master switch — set true to activate TRM v2 path
#                        in run_workflow.py and multi_lens_router.py.
#                        env: MYCELIUM_TRM_V2_ENABLED
# encoder_checkpoint   : path to the frozen SharedEncoder base checkpoint.
#                        Leave empty to initialise from the legacy TRM weights.
#                        env: MYCELIUM_TRM_V2_ENCODER_CHECKPOINT
# gate_checkpoint      : path to the DomainGate checkpoint.
#                        env: MYCELIUM_TRM_V2_GATE_CHECKPOINT
# gate_top_k           : how many domain heads the gate activates per query.
#                        env: MYCELIUM_TRM_V2_GATE_TOP_K
# gate_mode            : bootstrap | expansion | frozen
#                        Controls requires_grad on gate parameters at startup.
#                        env: MYCELIUM_TRM_V2_GATE_MODE
# ---------------------------------------------------------------------------
[trm_v2]
enabled             = false                              # env: MYCELIUM_TRM_V2_ENABLED
encoder_checkpoint  = "artifacts/trm_v2/encoder/base.pt" # env: MYCELIUM_TRM_V2_ENCODER_CHECKPOINT
gate_checkpoint     = "artifacts/trm_v2/gate/gate.pt"    # env: MYCELIUM_TRM_V2_GATE_CHECKPOINT
gate_top_k          = 3                                  # env: MYCELIUM_TRM_V2_GATE_TOP_K
gate_mode           = "frozen"                           # env: MYCELIUM_TRM_V2_GATE_MODE

# ---------------------------------------------------------------------------
# [domain_graph]  DomainGraphRegistry persistence + behaviour
# ---------------------------------------------------------------------------
# enabled              : activates the DomainGraphRegistry at startup.
#                        Requires [trm_v2] enabled = true to have any effect
#                        on inference routing.
#                        env: MYCELIUM_DOMAIN_GRAPH_ENABLED
# graph_path           : JSON file where the graph is persisted between runs.
#                        The directory is created automatically if absent.
#                        env: MYCELIUM_DOMAIN_GRAPH_PATH
# graph_schema_version : bumped on breaking schema changes; checked on load.
#                        env: MYCELIUM_DOMAIN_GRAPH_SCHEMA_VERSION
# ---------------------------------------------------------------------------
[domain_graph]
enabled              = false                                      # env: MYCELIUM_DOMAIN_GRAPH_ENABLED
graph_path           = "artifacts/domain_graph/graph.json"        # env: MYCELIUM_DOMAIN_GRAPH_PATH
graph_schema_version = "1.0"                                      # env: MYCELIUM_DOMAIN_GRAPH_SCHEMA_VERSION

# ---------------------------------------------------------------------------
# [sqlite_experts]  SQLite-sharded domain store
# ---------------------------------------------------------------------------
# enabled          : activates the SQLiteDomainStore retrieval path.
#                    When false the legacy UnifiedBERTExpert path is used.
#                    env: MYCELIUM_SQLITE_EXPERTS_ENABLED
# root_dir         : directory that contains one <domain_id>.sqlite file per domain.
#                    Created automatically on first onboarding run.
#                    env: MYCELIUM_SQLITE_EXPERTS_ROOT_DIR
# use_fts5         : enable the FTS5 virtual table for full-text pre-filtering.
#                    Set false only on very constrained SQLite builds that lack
#                    the FTS5 extension.
#                    env: MYCELIUM_SQLITE_EXPERTS_USE_FTS5
# vector_extension : "auto"            — probe for sqlite-vec, fall back to Python
#                    "sqlite-vec"      — require the extension (error if absent)
#                    "python-fallback" — always use Python-side cosine similarity
#                    env: MYCELIUM_SQLITE_EXPERTS_VECTOR_EXTENSION
# ---------------------------------------------------------------------------
[sqlite_experts]
enabled          = false                   # env: MYCELIUM_SQLITE_EXPERTS_ENABLED
root_dir         = "artifacts/sqlite_experts" # env: MYCELIUM_SQLITE_EXPERTS_ROOT_DIR
use_fts5         = true                    # env: MYCELIUM_SQLITE_EXPERTS_USE_FTS5
vector_extension = "auto"                  # env: MYCELIUM_SQLITE_EXPERTS_VECTOR_EXTENSION

# ---------------------------------------------------------------------------
# [cold_storage]  Domain cold-store and reactivation settings
# ---------------------------------------------------------------------------
# enabled                : activates the ColdStorageManager lifecycle.
#                          env: MYCELIUM_COLD_STORAGE_ENABLED
# quantize_on_store      : if true, head checkpoints are quantized (INT8/FP16)
#                          when a domain is cold-stored to reduce disk footprint.
#                          env: MYCELIUM_COLD_STORAGE_QUANTIZE_ON_STORE
# replay_min_samples     : minimum replay-buffer samples required before a
#                          domain may be cold-stored.  Prevents premature eviction
#                          of under-trained domains.
#                          env: MYCELIUM_COLD_STORAGE_REPLAY_MIN_SAMPLES
# replay_max_samples     : hard cap on samples kept in the replay buffer.
#                          Older samples are evicted FIFO once this limit is hit.
#                          env: MYCELIUM_COLD_STORAGE_REPLAY_MAX_SAMPLES
# reactivation_queue     : if true, cold-domain reactivation requests are queued
#                          and processed asynchronously (non-blocking inference).
#                          If false, reactivation is synchronous (blocking).
#                          env: MYCELIUM_COLD_STORAGE_REACTIVATION_QUEUE
# ---------------------------------------------------------------------------
[cold_storage]
enabled                = false   # env: MYCELIUM_COLD_STORAGE_ENABLED
quantize_on_store      = true    # env: MYCELIUM_COLD_STORAGE_QUANTIZE_ON_STORE
replay_min_samples     = 500     # env: MYCELIUM_COLD_STORAGE_REPLAY_MIN_SAMPLES
replay_max_samples     = 1000    # env: MYCELIUM_COLD_STORAGE_REPLAY_MAX_SAMPLES
reactivation_queue     = true    # env: MYCELIUM_COLD_STORAGE_REACTIVATION_QUEUE
